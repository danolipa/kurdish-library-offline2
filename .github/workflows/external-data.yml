name: External Book Data Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cmu_offset:
        description: "CMU dataset offset"
        required: false
        default: ""
      cmu_limit:
        description: "Books to queue in this batch"
        required: false
        default: "1000"
  schedule:
    - cron: "15 2 * * 0"
    - cron: "45 2 * * 3"
    - cron: "15 2 * * 6"

permissions:
  contents: write

# SQuALITY can be run safely from a push whose commit message contains [populate-squality].
# Public library expansion can be run from a push whose commit message contains [populate-library].

concurrency:
  group: external-book-data
  cancel-in-progress: false

jobs:

  populate-public-library:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[populate-library]')) || (github.event_name == 'schedule' && github.event.schedule == '15 2 * * 6')
    env:
      HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Import Open Library metadata
        env:
          OPENLIBRARY_LIMIT: "900"
          OPENLIBRARY_QUERIES: "classic literature,philosophy,psychology,science,history,education,business,spirituality,productivity,leadership,technology,health"
        run: npm run public-data:openlibrary
      - run: npm run public-data:pack
      - run: npm run public-data:apply
      - name: Import open book summary sources
        run: npm run sources:import
      - name: Translate public summaries to Sorani
        if: env.HAS_GROQ == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          OPEN_SOURCE_TRANSLATE_LIMIT: "100"
        run: npm run sources:translate
      - run: npm run sources:merge
      - run: npm run content:validate
      - name: Commit public library expansion
        run: |
          git config user.name "kurdish-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/public-sources src/data/library.json content/open-sources src/data/summaries.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expand public library metadata and summaries"
          git pull --rebase origin main
          git push
  import-squality:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[populate-squality]')) || (github.event_name == 'schedule' && github.event.schedule == '45 2 * * 3')
    env:
      HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run external:squality
      - run: npm run sources:squality:merge
      - name: Translate SQuALITY summaries
        if: env.HAS_GROQ == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          OPEN_SOURCE_TRANSLATE_LIMIT: "10"
          OPEN_SOURCE_TRANSLATE_SOURCE: "SQuALITY v1.3"
        run: |
          if [ -n "$GROQ_API_KEY" ]; then npm run sources:translate; else echo "GROQ_API_KEY is not configured; skipping translation."; fi
      - run: npm run sources:merge
      - name: Publish SQuALITY changes on latest main
        run: |
          set -e
          git config user.name "kurdish-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            git pull --rebase origin main
          else
            git stash push --include-untracked -m "generated-squality-data"
            git pull --rebase origin main
            git stash pop
          fi
          git add content/external/squality-plot.json content/open-sources src/data/summaries.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import and translate SQuALITY summaries"
          git push

  import-cmu:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[populate-cmu]')) || (github.event_name == 'schedule' && github.event.schedule == '15 2 * * 0')
    env:
      HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run external:cmu
        env:
          CMU_OFFSET: ${{ inputs.cmu_offset || '' }}
          CMU_LIMIT: ${{ inputs.cmu_limit || '1300' }}
      - run: npm run sources:cmu:queue-merge
      - run: npm run cmu:merge-library
      - name: Translate CMU summaries
        if: env.HAS_GROQ == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          OPEN_SOURCE_TRANSLATE_LIMIT: "25"
          OPEN_SOURCE_TRANSLATE_SOURCE: "CMU Book Summary Dataset"
        run: npm run sources:translate
      - run: npm run sources:merge
      - name: Publish CMU changes on latest main
        run: |
          set -e
          git config user.name "kurdish-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            git pull --rebase origin main
          else
            git stash push --include-untracked -m "generated-cmu-data"
            git pull --rebase origin main
            git stash pop
          fi
          git add content/external/cmu content/open-sources src/data/library.json src/data/summaries.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import and translate CMU book-summary batch"
          git push
