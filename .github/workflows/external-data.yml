name: External Book Data Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cmu_offset:
        description: "CMU dataset offset"
        required: false
        default: ""
      cmu_limit:
        description: "Books to queue in this batch"
        required: false
        default: "1000"
  schedule:
    - cron: "15 2 * * 0"
    - cron: "45 2 * * 3"

permissions:
  contents: write

# SQuALITY can be run safely from a push whose commit message contains [populate-squality].

concurrency:
  group: external-book-data
  cancel-in-progress: false

jobs:
  import-squality:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[populate-squality]')) || (github.event_name == 'schedule' && github.event.schedule == '45 2 * * 3')
    env:
      HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run external:squality
      - run: npm run sources:squality:merge
      - name: Translate SQuALITY summaries
        if: env.HAS_GROQ == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          OPEN_SOURCE_TRANSLATE_LIMIT: "10"
          OPEN_SOURCE_TRANSLATE_SOURCE: "SQuALITY v1.3"
        run: |
          if [ -n "$GROQ_API_KEY" ]; then npm run sources:translate; else echo "GROQ_API_KEY is not configured; skipping translation."; fi
      - run: npm run sources:merge
      - name: Commit SQuALITY data
        run: |
          git config user.name "kurdish-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/external/squality-plot.json content/open-sources/imported-summaries.json content/open-sources/translated-summaries.json src/data/summaries.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import and translate SQuALITY summaries"
          git pull --rebase origin main
          git push

  import-cmu:
    env:
      HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run external:cmu
        env:
          CMU_OFFSET: ${{ inputs.cmu_offset || '' }}
          CMU_LIMIT: ${{ inputs.cmu_limit || '1000' }}
      - run: npm run sources:cmu:queue-merge
      - name: Translate CMU summaries
        if: env.HAS_GROQ == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          OPEN_SOURCE_TRANSLATE_LIMIT: "25"
          OPEN_SOURCE_TRANSLATE_SOURCE: "CMU Book Summary Dataset"
        run: npm run sources:translate
      - run: npm run sources:merge
      - name: Commit CMU data
        run: |
          git config user.name "kurdish-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/external/cmu content/open-sources/imported-summaries.json content/open-sources/translated-summaries.json src/data/summaries.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import and translate CMU book-summary batch"
          git pull --rebase origin main
          git push
