name: External Book Data Pipeline

on:
  push:
    paths:
      - "scripts/cmu-build-queue.mjs"
      - "content/external/**"
      - ".github/workflows/external-data.yml"
  workflow_dispatch:
    inputs:
      cmu_offset:
        description: "CMU dataset offset"
        required: false
        default: ""
      cmu_limit:
        description: "Books to queue in this batch"
        required: false
        default: "1000"
  schedule:
    - cron: "15 2 * * 0"

permissions:
  contents: write

jobs:
  import-cmu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run external:cmu
        env:
          CMU_OFFSET: ${{ inputs.cmu_offset || '' }}
          CMU_LIMIT: ${{ inputs.cmu_limit || '1000' }}
      - name: Commit CMU queue
        run: |
          git config user.name "kurdish-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/external/cmu
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import CMU book-summary batch"
          git push
