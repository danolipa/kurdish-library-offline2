name: Import Open Book Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"
    - cron: "15 3 * * 4"

permissions:
  contents: write

concurrency:
  group: open-book-source-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run sources:import
      - run: npm run sources:merge
      - name: Translate new source summaries to Central Kurdish
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          OPEN_SOURCE_TRANSLATE_LIMIT: 10
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is not configured; skipping translation."
          else
            npm run sources:translate
          fi
      - run: npm run sources:merge
      - name: Import Open Library metadata
        env:
          OPENLIBRARY_LIMIT: 500
        run: npm run public-data:openlibrary
      - name: Build Open Library pack
        run: npm run public-data:pack
      - name: Merge Open Library metadata into app
        run: npm run public-data:apply
      - name: Commit imported source data
        run: |
          git config user.name "kurdish-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/open-sources/imported-summaries.json src/data/summaries.json content/public-sources/openlibrary-books.json content/public-sources/openlibrary-pack.json src/data/library.json
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi
          git commit -m "Refresh licensed open book sources"
          git pull --rebase origin main
          git push
