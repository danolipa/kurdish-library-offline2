name: Translate Open Book Sources

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Translations per run"
        required: false
        default: "10"
  schedule:
    - cron: "45 */6 * * *"

permissions:
  contents: write

concurrency:
  group: open-book-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Translate when Groq secret is available
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPEN_SOURCE_TRANSLATE_LIMIT: ${{ inputs.limit || '10' }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is not configured yet; skipping translation."
            exit 0
          fi
          npm run sources:translate
      - run: npm run sources:merge
      - name: Commit translated source data
        run: |
          git config user.name "kurdish-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/open-sources/translated-summaries.json src/data/summaries.json
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          git commit -m "Translate open book summaries to Sorani"
          git push
