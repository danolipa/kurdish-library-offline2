name: Build Kurdish Library
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
      - run: npx tsc --noEmit
      - run: rm -rf android && npx cap add android
      - run: npx cap sync android
      - name: Align AndroidX browser dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/build.gradle")
          s = p.read_text()
          block = """\nallprojects {\n  configurations.configureEach {\n    resolutionStrategy.force("androidx.browser:browser:1.9.0")\n  }\n}\n"""
          if "androidx.browser:browser:1.9.0" not in s:
              p.write_text(s.rstrip() + block)
          PY
      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: kurdish-library-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
