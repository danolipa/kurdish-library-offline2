<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="color-scheme" content="light dark">
  <title>کتێبخانەی کوردی</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f6f7fb;color:#172033}
    body{font-family:system-ui,-apple-system,"Noto Sans Arabic","Noto Sans",sans-serif}
    #root{min-height:100dvh}
    .app-boot{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
    .app-boot-card{width:min(360px,100%);padding:28px 22px;border:1px solid #e7e9f0;border-radius:24px;background:#fff;box-shadow:0 14px 40px rgba(15,23,42,.08)}
    .app-boot-icon{font-size:52px;line-height:1;margin-bottom:14px}
    .app-boot-title{font-size:22px;font-weight:800;margin-bottom:7px}
    .app-boot-text{font-size:14px;line-height:1.9;color:#6b7280}
    .app-boot-spinner{width:28px;height:28px;margin:18px auto 0;border:3px solid #e7e9f0;border-top-color:#5b4bdb;border-radius:50%;animation:bootspin .8s linear infinite}
    @keyframes bootspin{to{transform:rotate(360deg)}}
    @media(prefers-color-scheme:dark){
      html,body{background:#090d16;color:#edf1f7}
      .app-boot-card{background:#121927;border-color:#273246}
      .app-boot-text{color:#98a2b3}
      .app-boot-spinner{border-color:#273246;border-top-color:#7c6cf2}
    }
    @media(prefers-reduced-motion:reduce){.app-boot-spinner{animation:none}}
  </style>
</head>
<body>
  <div id="root">
    <main class="app-boot" aria-live="polite">
      <section class="app-boot-card">
        <div class="app-boot-icon">📚</div>
        <div class="app-boot-title">کتێبخانەی کوردی</div>
        <div class="app-boot-text">بەرنامەکە خەریکی بارکردنی کتێبخانەکەیە…</div>
        <div class="app-boot-spinner" aria-hidden="true"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
